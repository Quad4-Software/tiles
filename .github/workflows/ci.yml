name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: package + release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=${GITHUB_REF_NAME}
          tar -czf tiles-${tag}-x86_64-unknown-linux-gnu.tar.gz \
            -C target/release tiles
          sha256sum tiles-${tag}-x86_64-unknown-linux-gnu.tar.gz > \
            tiles-${tag}-x86_64-unknown-linux-gnu.tar.gz.sha256
          gh release create "$tag" --generate-notes \
            tiles-${tag}-x86_64-unknown-linux-gnu.tar.gz \
            tiles-${tag}-x86_64-unknown-linux-gnu.tar.gz.sha256
